# Create/seed tables once per container start, then serve with gunicorn.
# PGHOST / PGDATABASE / PGUSER / PGPORT are injected by the app's `database` resource.
command:
  - sh
  - -c
  - >-
    python -m src.dash_dbx_writeback.initialize_app &&
    exec gunicorn src.dash_dbx_writeback.app:server
    --workers=2 --bind=0.0.0.0:8000 --timeout=120

env:
  - name: LAKEBASE_SCHEMA
    value: public
