bundle:
  name: dash_dbx_writeback

include:
  - resources/*.yml

variables:
  instance_name:
    description: Lakebase database instance name
  database:
    description: Database inside the Lakebase instance
    default: databricks_postgres

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      # Deploy prod from CI as a service principal so there is exactly one copy
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
