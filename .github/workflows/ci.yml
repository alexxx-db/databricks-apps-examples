name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Lint (runtime errors only, see ruff.toml)
        run: uvx ruff check .

      - name: Requirements resolve on the Apps runtime (Python 3.11)
        run: |
          for f in */requirements.txt; do
            echo "::group::$f"
            uv pip compile --python-version 3.11 --quiet "$f" -o "$RUNNER_TEMP/resolved.txt"
            echo "::endgroup::"
          done

      - name: dash-dbx-writeback unit tests (no Lakebase needed)
        working-directory: dash-dbx-writeback
        run: uv run --python 3.11 --extra dev python -m pytest -m "not integration"

      - name: fastapi-obo tests
        working-directory: fastapi-obo
        run: uv run --no-project --python 3.11 --with-requirements requirements.txt --with pytest --with httpx python -m pytest

  appkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: appkit-analytics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appkit-analytics/package-lock.json
      # --ignore-scripts skips typegen, which needs a warehouse; generated types are committed
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:ast-grep
      # No `npm test`: the template has no tests and vitest passes with none. Add one before gating on it.

  bundles:
    runs-on: ubuntu-latest
    # Add repo secrets DATABRICKS_HOST / _CLIENT_ID / _CLIENT_SECRET (a service principal on a
    # sandbox workspace) to enable this job. Only the validate step sees the credentials.
    env:
      HAS_WORKSPACE: ${{ secrets.DATABRICKS_HOST != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.19.0
        if: env.HAS_WORKSPACE == 'true'
      - name: Validate every bundle (dev and prod)
        if: env.HAS_WORKSPACE == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          set -e
          validate() {
            dir=$1; shift
            for target in dev prod; do
              (cd "$dir" && databricks bundle validate --strict -t "$target" "$@")
            done
          }
          validate auth-demo          --var warehouse_id=ci-placeholder
          validate apps-shell         --var warehouse_id=ci-placeholder
          validate apps-write-back    --var warehouse_id=ci-placeholder --var lakebase_instance=ci-placeholder
          validate dash-dbx-writeback --var instance_name=ci-placeholder
          validate vector-search      --var vector_search_index=main.default.ci_placeholder
          validate fastapi-obo        --var warehouse_id=ci-placeholder
          validate appkit-analytics   --var sql_warehouse_id=ci-placeholder
