bundle:
  name: appkit-analytics

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID

resources:
  apps:
    app:
      name: appkit-analytics-${bundle.target}
      description: "AppKit (TypeScript/React) analytics starter: governed SQL queries on a SQL warehouse"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # config/queries/*.obo.sql run as the signed-in user
      user_api_scopes:
        - sql

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      # Deploy prod from CI as a service principal so there is exactly one copy
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
