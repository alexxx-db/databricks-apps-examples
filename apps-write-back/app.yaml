command:
  - gunicorn
  - --chdir=src
  - app:server
  - --workers=2
  - --bind=0.0.0.0:8000
  # Match the Apps proxy's 120s request limit; gunicorn's 30s default kills cold-warehouse queries
  - --timeout=120

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # PGHOST / PGDATABASE / PGUSER / PGPORT are injected by the `database` resource
  - name: UNITY_CATALOG_CATALOG
    value: "main"
  - name: UNITY_CATALOG_SCHEMA
    value: "apps_examples"
  - name: POSTGRES_SCHEMA
    value: "apps_examples"
